<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Deadlines</title>

<!-- Home screen. On iOS these four are what turn "add to home screen" from a
     bookmark into something that opens full screen with its own icon; Safari
     reads them over plain http, so no tunnel is needed for this part.
     The status bar stays "default" rather than translucent on purpose: the
     header is sticky at top:0 and the page has no safe-area-inset-top, so a
     translucent bar would put the clock over the course filters. -->
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deadlines">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">

<!-- Maths in the prep notes. If this fails to load (no internet on the phone,
     say) the raw TeX shows instead, which is still readable -- so it is not
     worth blocking the page for. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16191f;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --yes: #12805c;
    --yes-bg: #e7f6f0;
    --no: #9aa1ab;
    --no-bg: #f0f2f4;
    --past: #b42318; --past-bg: #fde8e6;
    --now: #b4530a;  --now-bg: #fdeddd;
    --soon: #8a6100; --soon-bg: #fbf1d4;
    --mid: #1d4ed8;  --mid-bg: #e6edfd;
    --radius: 14px;
    --card-rgb: 255, 255, 255;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --ink: #e8eaed; --muted: #9aa1ab;
      --line: #262c36; --accent: #6ea8fe; --yes: #3ddc9a; --yes-bg: #12271f;
      --no: #7b828c; --no-bg: #1e232b;
      --past: #ff8b7d; --past-bg: #35211f;
      --now: #ffa964;  --now-bg: #33251a;
      --soon: #e8c25c; --soon-bg: #2f2a19;
      --mid: #8fb6ff;  --mid-bg: #1b2436;
      --card-rgb: 23, 27, 34;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 18px 16px 10px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: -0.02em; }
  .stats { color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); font-weight: 600; }

  /* A dead Pi and a quiet week look identical from here unless the page
     says so out loud. Silent staleness is the failure this whole project
     exists to prevent. */
  .health { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .health.stale {
    color: var(--past); background: var(--past-bg); font-weight: 600;
    display: inline-block; padding: 4px 9px; border-radius: 8px; margin-top: 7px;
  }

  /* A decision has to be reversible after the undo bar has gone, or a
     mis-tap is permanent. */
  .tabs { display: flex; gap: 4px; margin-top: 11px; }
  .tabs button {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 8px; font-size: 13px;
    border: 1px solid transparent; background: none; color: var(--muted);
    cursor: pointer; font-family: inherit;
  }
  .tabs button[aria-pressed="true"] {
    background: var(--card); border-color: var(--line); color: var(--ink);
    font-weight: 600;
  }
  .actions .back {
    width: auto; padding: 0 13px; font-size: 13px; font-weight: 600;
    color: var(--accent); background: var(--card);
  }
  .oncal { color: var(--yes); }

  .filters {
    display: flex; gap: 7px; overflow-x: auto; padding: 10px 16px 12px;
    scrollbar-width: none; background: var(--bg);
    position: sticky; top: 68px; z-index: 9; border-bottom: 1px solid var(--line);
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; }
  .group-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin: 22px 0 9px; font-weight: 600;
  }
  .group-label:first-child { margin-top: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 12px; margin-bottom: 9px;
    display: grid; grid-template-columns: auto 1fr minmax(150px, 300px) auto;
    gap: 13px; align-items: center;
    transition: opacity .18s, transform .18s;
  }

  /* Wide enough to spare the room: the quote sits in its own column
     instead of hiding behind a button, and the button is unnecessary. */
  .quote {
    font-size: 12.5px; line-height: 1.4; color: var(--muted); font-style: italic;
    border-left: 3px solid var(--chip-ink, var(--line)); padding-left: 10px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .note { display: none; }

  /* Below this the quote column will not fit, so it collapses behind the
     note button and opens across the foot of the card. */
  @media (max-width: 860px) {
    .card { grid-template-columns: auto 1fr auto; }
    .card .quote { display: none; }
    .card .note { display: grid; }
  }
  /* On a phone three buttons in one row squeeze the title into four
     lines, so they drop to their own row instead. */
  @media (max-width: 560px) {
    .card { grid-template-columns: auto 1fr; gap: 10px; }
    .card .actions { grid-column: 2; grid-row: 2; justify-self: end; }
  }
  .card.going { opacity: 0; transform: translateX(28px); }

  /* The date is the thing being scanned for, so it reads first: a block
     of its own, sized and coloured by how soon it is. */
  .date {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-width: 78px; padding: 8px 8px 7px;
    border-radius: 11px; background: var(--chip-bg); color: var(--chip-ink);
    line-height: 1.12;
  }
  .dow { font-size: 11px; font-weight: 700; letter-spacing: .09em; opacity: .8; }
  .dnum { font-size: 21px; font-weight: 750; letter-spacing: -0.02em; margin: 1px 0; }
  .dtime { font-size: 12.5px; font-weight: 650; opacity: .92; }
  .dsoon {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; margin-top: 3px; opacity: .82;
  }
  .date.none { min-width: 78px; background: transparent;
    border: 1px dashed var(--line); color: var(--muted); }
  .date.none .dnum { font-size: 13px; font-weight: 650; }

  /* Urgency palette -- red past due, orange now, amber this week. */
  .card[data-urgency="past"], .ag-row[data-urgency="past"], .sheet[data-urgency="past"] { --chip-bg: var(--past-bg); --chip-ink: var(--past); }
  .card[data-urgency="now"], .ag-row[data-urgency="now"], .sheet[data-urgency="now"]  { --chip-bg: var(--now-bg);  --chip-ink: var(--now); }
  .card[data-urgency="soon"], .ag-row[data-urgency="soon"], .sheet[data-urgency="soon"] { --chip-bg: var(--soon-bg); --chip-ink: var(--soon); }
  .card[data-urgency="mid"], .ag-row[data-urgency="mid"], .sheet[data-urgency="mid"]  { --chip-bg: var(--mid-bg);  --chip-ink: var(--mid); }
  .card[data-urgency="far"], .ag-row[data-urgency="far"], .sheet[data-urgency="far"]  { --chip-bg: var(--no-bg);   --chip-ink: var(--muted); }
  .card[data-urgency="none"], .ag-row[data-urgency="none"], .sheet[data-urgency="none"] { --chip-bg: transparent;    --chip-ink: var(--muted); }

  .title { font-size: 15px; font-weight: 600; margin: 0 0 4px; line-height: 1.3; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
    background: var(--no-bg); color: var(--muted);
  }
  .tag.unsure { color: var(--soon); }
  /* An inferred date -- tied to something dated, not stated by any
     document -- so it should not look like a published deadline. */
  .tag.linked { color: var(--accent); }

  .actions .note { margin-right: 6px; }
  .note {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .note svg { width: 16px; height: 16px; }
  .note[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note:active { transform: scale(.92); }

  .evidence {
    grid-column: 1 / -1; margin: 3px 2px 0; font-size: 12.5px; color: var(--muted);
    border-left: 3px solid var(--chip-ink, var(--line)); padding: 5px 0 5px 10px;
    font-style: italic;
  }

  .actions { display: flex; gap: 6px; align-items: center; }
  .actions button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    font-size: 17px; cursor: pointer; background: var(--no-bg); color: var(--no);
    font-family: inherit; display: grid; place-items: center;
  }
  .actions .yes { background: var(--yes-bg); color: var(--yes); border-color: transparent; }
  .actions button:active { transform: scale(.92); }

  /* The vault, read on a phone. Called .vnote, not .note: .note is
     already the little evidence button on a card, and the wide layout
     sets it to display:grid -- which turned a whole study document
     into a narrow grid column with a button's border round the title. Deliberately plain -- this is a study
     document, and anything decorative here is in the way. */
  .vnote { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px 15px; margin: 10px 12px; }
  .vnote h1 { font-size: 19px; margin: 0 0 10px; }
  .vnote h2 { font-size: 16px; margin: 20px 0 7px; }
  .vnote h3 { font-size: 14px; margin: 16px 0 5px; color: var(--muted); }
  .vnote p, .vnote li { font-size: 14px; line-height: 1.55; }
  /* A five-column cue sheet does not fit a phone. Let the table scroll
     inside the note rather than pushing the whole page sideways. */
  .vnote table { border-collapse: collapse; font-size: 13px; margin: 10px 0;
                 display: block; width: max-content; max-width: 100%;
                 overflow-x: auto; }
  .vnote th, .vnote td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; }
  .vnote th { background: var(--no-bg); }
  .vnote code { background: var(--no-bg); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .vnote pre { background: var(--no-bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .vnote blockquote { margin: 10px 0; padding: 2px 0 2px 12px;
                     border-left: 3px solid var(--line); color: var(--muted); }
  /* Wide tables scroll rather than squeezing the page sideways. */
  .vnote > * { max-width: 100%; }
  .noteitem { display: block; width: 100%; text-align: left; background: var(--card);
              border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
              margin: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .noteitem .where { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .noteitem .flag { color: var(--accent); font-size: 11.5px; }
  .backbar { margin: 10px 12px 0; }
  .backbar button { background: none; border: none; color: var(--accent);
                    font: inherit; font-size: 14px; cursor: pointer; padding: 4px 0; }
  .empty { text-align: center; color: var(--muted); padding: 56px 20px; font-size: 14px; }

  .undo {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 11px 16px;
    border-radius: 11px; font-size: 13.5px; display: none; gap: 14px;
    align-items: center; box-shadow: 0 5px 22px rgba(0,0,0,.22); z-index: 20;
  }
  .undo.show { display: flex; }
  .undo button {
    background: none; border: none; color: var(--bg); font-weight: 650;
    text-decoration: underline; cursor: pointer; font-size: 13.5px; font-family: inherit;
  }

  /* ---------------------------------------------------------- agenda
     The week as a spine. Rows keep the card's urgency colour as a stripe
     and a tick to keep. All names are ag-*, because .note once collided
     with the vault and cost an afternoon. */
  .agenda { list-style: none; margin: 0; padding: 0 0 0 2px; position: relative; }
  .agenda::before { content: ""; position: absolute; left: 21px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
  .ag-month {
    position: relative; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 600; margin: 18px 0 10px 56px;
  }
  .ag-month:first-child { margin-top: 4px; }
  .ag-day { display: grid; grid-template-columns: 44px 1fr; gap: 12px; margin-bottom: 12px; position: relative; }
  .ag-date {
    display: grid; justify-items: center; align-content: start; padding-top: 4px;
    position: relative; z-index: 1; font-variant-numeric: tabular-nums;
  }
  .ag-date .dow { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); height: 13px; }
  .ag-date .num {
    font-size: 19px; font-weight: 700; letter-spacing: -0.02em; width: 40px; height: 40px;
    display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--ink);
    margin-top: 2px; box-shadow: 0 0 0 4px var(--bg);
  }
  .ag-day.today .ag-date .num { background: var(--ink); color: var(--bg); }
  .ag-day.none .ag-date .num { box-shadow: inset 0 0 0 1px var(--line), 0 0 0 4px var(--bg); color: var(--muted); }
  .ag-items { display: grid; gap: 6px; min-width: 0; }
  .ag-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 0; }
  .ag-item {
    text-align: left; width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--card);
    border-radius: 13px; padding: 10px 12px 10px 15px; cursor: pointer; font: inherit; color: inherit;
    display: grid; gap: 3px; position: relative; overflow: hidden; transition: transform 100ms ease-out;
  }
  .ag-item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--chip-ink, var(--line)); }
  .ag-item:active { transform: scale(.985); }
  .ag-item .ttl { font-size: 14.5px; font-weight: 600; line-height: 1.25; }
  .ag-item .sub { font-size: 11.5px; color: var(--muted); display: flex; column-gap: 8px; row-gap: 2px; flex-wrap: wrap; }
  .ag-item .sub b { color: var(--chip-ink, var(--ink)); font-weight: 650; }
  .ag-item .sub .linked { color: var(--accent); }
  .ag-item .sub .unsure { color: var(--soon); }
  .ag-acts { display: flex; gap: 6px; }
  /* 44px: Apple's minimum for a thumb. The row grows to fit it. */
  .ag-acts button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    color: var(--no); cursor: pointer; padding: 0; display: grid; place-items: center;
    transition: transform 100ms ease-out; will-change: transform;
  }
  .ag-acts button:active { transform: scale(.9); }
  .ag-acts .ak { color: var(--yes); background: var(--yes-bg); border-color: transparent; }
  .ag-acts svg { width: 18px; height: 18px; }

  /* The detail sheet: a real surface with three resting heights. Content
     stays put behind it -- this page scrolls the document, not a stage. */
  .scrim { position: fixed; inset: 0; background: #000; opacity: 0; z-index: 30; pointer-events: none; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; height: 90vh; max-width: 720px; margin: 0 auto;
    border-radius: 22px 22px 0 0; touch-action: none; will-change: transform; transform: translateY(100%);
    visibility: hidden;
    background: rgba(var(--card-rgb), .86);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 -1px 0 rgba(255,255,255,.35) inset, 0 -8px 40px rgba(0,0,0,.25);
    padding: 8px 18px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none;
  }
  @media (prefers-reduced-transparency: reduce) {
    .sheet { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  .sheet .grip { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 6px; }
  .sheet .kind { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--chip-ink, var(--muted)); }
  .sheet .stitle { font-size: 21px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.15; }
  .sheet .swhen { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sheet .swhen span { color: var(--muted); font-weight: 500; }
  .sheet .scourse { font-size: 13px; color: var(--muted); }
  .sheet .squote {
    margin: 6px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--no-bg);
    font-size: 13.5px; line-height: 1.45; font-style: italic; color: var(--muted);
    border-left: 3px solid var(--chip-ink, var(--line));
  }
  .sheet .slinked { font-size: 13px; color: var(--accent); }
  .sheet .slinked:empty { display: none; }
  .sheet .sacts { display: flex; gap: 8px; margin-top: 8px; }
  .sheet .sacts button {
    flex: 1; height: 46px; border-radius: 12px; border: 0; font: inherit; font-size: 14.5px;
    font-weight: 650; cursor: pointer; transition: transform 100ms ease-out;
  }
  .sheet .sacts .keep { background: var(--yes); color: #fff; }
  .sheet .sacts .drop { background: var(--no-bg); color: var(--ink); }
  .sheet .sacts button:active { transform: scale(.96); }
  .sheet .shint { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1 id="heading">Deadlines</h1>
  <div class="stats" id="stats">loading…</div>
  <div class="health" id="health"></div>
  <div class="tabs" id="modes">
    <button aria-pressed="true"  data-mode="cards"  onclick="setMode('cards')">Deadlines</button>
    <button aria-pressed="false" data-mode="agenda" onclick="setMode('agenda')">Agenda</button>
    <button aria-pressed="false" data-mode="notes"  onclick="setMode('notes')">Notes</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="filters" id="filters"></div>

<main id="list"></main>

<div class="undo" id="undo">
  <span id="undo-text"></span>
  <button onclick="undoLast()">Undo</button>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Deadline" aria-hidden="true">
  <div class="grip"></div>
  <div class="kind" id="sheet-kind"></div>
  <div class="stitle" id="sheet-title"></div>
  <div class="swhen" id="sheet-when"></div>
  <div class="scourse" id="sheet-course"></div>
  <blockquote class="squote" id="sheet-quote"></blockquote>
  <div class="slinked" id="sheet-linked"></div>
  <div class="sacts">
    <button class="drop" onclick="sheetDecide('dismissed')">Dismiss</button>
    <button class="keep" onclick="sheetDecide('accepted')">Keep</button>
  </div>
  <div class="shint">Drag down to close</div>
</div>

<script>
let CARDS = [], COURSES = [], course = "all",
    status = "new", lastAction = null, undoTimer = null;

const api = (path, opts) => fetch(path, opts).then(r => r.json());

async function load() {
  // Labs and tutorials are always shown -- they are part of the week,
  // not a category to opt into.
  const data = await api(`/api/cards?status=${status}`);
  CARDS = data.cards;
  COURSES = data.courses;
  renderFilters();
  renderTabs();
  render();
  const s = await api('/api/summary');
  renderTabs(s);
  document.getElementById('stats').innerHTML =
    `<b>${s.new}</b> waiting · <b>${s.pending}</b> not scheduled yet · ${s.accepted} kept · ${s.dismissed} dismissed`;
}

function ago(hours) {
  if (hours < 1) return Math.max(1, Math.round(hours * 60)) + " min ago";
  if (hours < 24) { const h = Math.round(hours); return h + (h === 1 ? " hour ago" : " hours ago"); }
  const d = Math.round(hours / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

// Runs on load and every five minutes. It can only report that the scrape
// stopped working while the Pi is alive -- a Pi that is off cannot serve
// this page at all, which is its own, louder signal.
async function loadHealth() {
  const el = document.getElementById('health');
  let h;
  try { h = await api('/api/health'); }
  catch (e) { el.className = 'health'; el.textContent = ''; return; }

  if (h.lastSuccess === null) {
    el.className = 'health stale';
    el.textContent = "\u26a0 Never finished a check" +
      (h.error ? " \u2014 last try failed: " + h.error : "");
    return;
  }
  const when = "Last checked " + ago(h.ageHours);
  if (h.stale) {
    el.className = 'health stale';
    el.textContent = "\u26a0 " + when + " \u2014 this list may be out of date" +
      (h.error ? ". Last error: " + h.error : "");
  } else {
    el.className = 'health';
    el.textContent = when + (h.inWindow ? "" : " (overnight \u2014 next check at 7am)");
  }
}

function renderTabs(s) {
  const counts = s || {};
  const tabs = [['new', 'Waiting', counts.new], ['accepted', 'Kept', counts.accepted],
                ['dismissed', 'Dismissed', counts.dismissed]];
  document.getElementById('tabs').innerHTML = tabs.map(([v, label, n]) =>
    `<button aria-pressed="${status === v}" onclick="setStatus('${v}')">${label}${
      n === undefined ? '' : ` <span style="opacity:.6">${n}</span>`}</button>`).join('');
}

function setStatus(s) { status = s; course = 'all'; load(); }

function renderFilters() {
  // Chips carry the course's real name, not its code -- the code is on the
  // card itself, and a filter you cannot read is not a filter.
  const chips = [['all', 'All courses'],
                 ...COURSES.map(c => [c.value, c.name || c.code])];
  const el = document.getElementById('filters');
  el.innerHTML = chips.map(([v, label]) =>
    `<button class="chip" data-course="${esc(v)}" aria-pressed="${course === v}"
       onclick="setCourse('${esc(v).replace(/'/g, "\\'")}')">${esc(label)}</button>`
  ).join('');
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function setCourse(c) {
  course = c; renderFilters();
  if (MODE === 'notes') renderNotes(); else render();
}

// ------------------------------------------------------------------ notes

let MODE = 'cards', NOTES = [], OPEN = null;

function setMode(m) {
  MODE = m; OPEN = null;
  document.querySelectorAll('#modes button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.mode === m));
  document.getElementById('heading').textContent =
    m === 'cards' ? 'Deadlines' : m === 'agenda' ? 'Agenda' : 'Notes';
  // The agenda is the waiting list laid out by day; kept and dismissed
  // items have already left it, so the status tabs do not apply.
  document.getElementById('tabs').style.display = m === 'cards' ? '' : 'none';
  if (m === 'agenda') status = 'new';
  if (m === 'notes') loadNotes(); else load();
}

async function loadNotes() {
  const data = await api('/api/vault');
  NOTES = data.notes || [];
  COURSES = [...new Set(NOTES.map(n => n.course).filter(Boolean))]
              .sort().map(c => ({ value: c, code: c, name: c }));
  document.getElementById('stats').textContent =
    data.built ? `${NOTES.length} notes in the vault`
               : 'No vault yet — run vault.py on the Pi';
  renderFilters();
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById('list');
  if (OPEN) {
    list.innerHTML =
      `<div class="backbar"><button onclick="closeNote()">&larr; All notes</button></div>
       <article class="vnote">${OPEN.html}</article>`;
    window.scrollTo(0, 0);
    if (window.renderMathInElement) {
      try {
        renderMathInElement(list, { delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false }], throwOnError: false });
      } catch (e) { /* raw TeX is still readable */ }
    }
    return;
  }

  const shown = NOTES.filter(n => course === 'all' || n.course === course);
  if (!shown.length) {
    list.innerHTML = `<div class="empty">No notes here yet.</div>`;
    return;
  }
  // Course note first, then prepared work, then everything else.
  shown.sort((a, b) => (a.order - b.order)
    || a.course.localeCompare(b.course) || a.title.localeCompare(b.title));

  list.innerHTML = shown.map(n => `
    <button class="noteitem" onclick="openNote('${esc(n.path).replace(/'/g, "\\'")}')">
      ${esc(n.title)}${n.prepared ? ' <span class="flag">· prepared</span>' : ''}
      <span class="where">${esc(n.course || 'Dashboard')}${
        n.folder ? ' · ' + esc(n.folder) : n.isCourseNote ? ' · course note' : ''}</span>
    </button>`).join('');
}

async function openNote(path) {
  OPEN = await api('/api/vault/note?path=' + encodeURIComponent(path));
  renderNotes();
}

function closeNote() { OPEN = null; renderNotes(); }

function bucket(card) {
  if (card.pending || card.days === null) return 'No date yet';
  if (card.days < 0) return 'Overdue';
  if (card.days === 0) return 'Today';
  if (card.days === 1) return 'Tomorrow';
  if (card.days <= 7) return 'This week';
  if (card.days <= 30) return 'This month';
  return 'Later';
}

const ORDER = ['Overdue', 'Today', 'Tomorrow', 'This week', 'This month', 'Later', 'No date yet'];

function render() { if (MODE === 'agenda') renderAgenda(); else renderCards(); }

function renderCards() {
  const shown = CARDS.filter(c => course === 'all' || c.course === course);
  const list = document.getElementById('list');

  if (!shown.length) {
    list.innerHTML = `<div class="empty">${
      status === 'new' ? 'Nothing waiting on you here.'
      : status === 'accepted' ? 'Nothing kept yet.' : 'Nothing dismissed yet.'}</div>`;
    return;
  }

  const groups = {};
  shown.forEach(c => (groups[bucket(c)] ||= []).push(c));

  list.innerHTML = ORDER.filter(g => groups[g]).map(g => `
    <div class="group-label">${g}</div>
    ${groups[g].map(cardHTML).join('')}
  `).join('');
}

const NOTE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

function urgencyOf(c) {
  if (c.pending || c.days === null) return 'none';
  if (c.days < 0) return 'past';
  if (c.days <= 1) return 'now';
  if (c.days <= 7) return 'soon';
  if (c.days <= 30) return 'mid';
  return 'far';
}

function dateBlock(c) {
  // A to-do has no date because none exists, which is different from a
  // deadline whose date has not been announced yet. Say which. A to-do that
  // has been linked to something dated falls through to the normal block.
  if (c.kind === 'todo' && !c.date) {
    return `<div class="date none"><span class="dnum">to do</span>
      <span class="dsoon">no deadline</span></div>`;
  }
  if (c.pending || !c.date) {
    return `<div class="date none"><span class="dnum">no date</span>
      <span class="dsoon">not set</span></div>`;
  }
  // "Tue 22 Sep" -> day name on top, number and month beneath.
  const [dow, ...rest] = esc(c.when).replace(/\b0(\d)/, '$1').split(' ');
  const soon = c.days < 0 ? `${-c.days}d ago`
    : c.days === 0 ? 'today' : c.days === 1 ? 'tomorrow'
    : c.days <= 30 ? `${c.days} days` : `${Math.round(c.days / 7)} wks`;
  return `<div class="date">
    <span class="dow">${dow}</span>
    <span class="dnum">${rest.join(' ')}</span>
    ${c.time ? `<span class="dtime">${esc(c.time)}</span>` : ''}
    <span class="dsoon">${soon}</span>
  </div>`;
}

function cardHTML(c) {
  const unsure = c.confidence !== 'high'
    ? `<span class="tag unsure">${c.confidence === 'low' ? 'unsure' : 'check'}</span>` : '';

  return `
  <article class="card" data-id="${c.id}" data-urgency="${urgencyOf(c)}">
    ${dateBlock(c)}
    <div class="body">
      <h2 class="title">${esc(c.title)}</h2>
      <div class="tags">
        <span class="tag">${esc(c.kind)}</span>
        <span class="tag">${esc(c.courseCode)}${c.courseName ? ' \u00b7 ' + esc(c.courseName) : ''}</span>
        ${c.linkedTo ? `<span class="tag linked">before ${esc(c.linkedTo)}</span>` : ''}
        ${c.onCalendar ? '<span class="tag oncal">in calendar</span>' : ''}
        ${unsure}
      </div>
    </div>
    <div class="quote">${c.evidence ? '\u201c' + esc(c.evidence.slice(0, 200)) + '\u201d' : ''}</div>
    <div class="actions">
      ${c.evidence
        ? `<button class="note" aria-expanded="false" aria-label="Where this came from"
             onclick="toggleNote(this, ${c.id})">${NOTE_ICON}</button>` : ''}
      ${status === 'new'
        ? `<button class="no" onclick="decide(${c.id}, 'dismissed')" aria-label="Dismiss">✕</button>
           <button class="yes" onclick="decide(${c.id}, 'accepted')" aria-label="Keep">✓</button>`
        : `<button class="back" onclick="decide(${c.id}, 'new')">put back</button>`}
    </div>
  </article>`;
}

function toggleNote(button, id) {
  const card = button.closest('.card');
  const open = button.getAttribute('aria-expanded') === 'true';
  const existing = card.querySelector('.evidence');
  if (existing) existing.remove();
  button.setAttribute('aria-expanded', String(!open));
  if (open) return;
  const c = CARDS.find(x => x.id === id);
  const p = document.createElement('div');
  p.className = 'evidence';
  p.textContent = '\u201c' + c.evidence.slice(0, 340) + '\u201d';
  card.appendChild(p);
}

async function decide(id, newStatus) {
  const card = CARDS.find(c => c.id === id);
  const el = document.querySelector(`.card[data-id="${id}"], .ag-row[data-id="${id}"]`);
  const drop = () => { CARDS = CARDS.filter(c => c.id !== id); render(); };

  // Remove it locally straight away; a tap should never wait on the network.
  if (el && el.classList.contains('ag-row')) collapseRow(el, drop);
  else { if (el) el.classList.add('going'); setTimeout(drop, 180); }
  const reply = await api('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, status: newStatus})
  });
  window.__lastCalendar = reply && reply.calendar;

  const result = await api('/api/summary').catch(() => null);
  lastAction = {id, card};
  showUndo(newStatus === 'accepted'
      ? (window.__lastCalendar === 'added' ? 'Added to calendar' : 'Kept')
    : newStatus === 'dismissed' ? 'Dismissed' : 'Put back', card);
  api('/api/summary').then(s => {
    renderTabs(s);
    document.getElementById('stats').innerHTML =
      `<b>${s.new}</b> waiting · <b>${s.pending}</b> not scheduled yet · ${s.accepted} kept · ${s.dismissed} dismissed`;
  });
}

function showUndo(what, card) {
  const bar = document.getElementById('undo');
  document.getElementById('undo-text').textContent = `${what}: ${card.title.slice(0, 34)}`;
  bar.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => bar.classList.remove('show'), 5000);
}

async function undoLast() {
  if (!lastAction) return;
  await api('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: lastAction.id, status: 'new'})
  });
  document.getElementById('undo').classList.remove('show');
  lastAction = null;
  load();
}

// ------------------------------------------------------------------ agenda
// Springs, parameterised the way Apple's designers think about them: a
// damping ratio (1.0 = settles with no overshoot) and a response time in
// seconds. Not a duration -- settle time emerges. Units are px and px/s.
// Every motion below starts from wherever the thing is now and inherits
// the finger's velocity, so nothing ever finishes an animation first.
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

class Spring {
  constructor(value = 0, { response = 0.35, damping = 1, eps = 0.15 } = {}) {
    this.x = value; this.v = 0; this.t = value;
    this.response = response; this.damping = damping; this.eps = eps;
  }
  retarget(t, { velocity, response, damping } = {}) {
    this.t = t;
    if (velocity != null) this.v = velocity;
    if (response != null) this.response = response;
    if (damping != null) this.damping = damping;
    return this;
  }
  step(dt) {
    if (REDUCED) { this.x = this.t; this.v = 0; return this.x; }
    const w = 2 * Math.PI / this.response, k = w * w, c = 2 * this.damping * w;
    const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = -k * (this.x - this.t) - c * this.v;
      this.v += a * h; this.x += this.v * h;
    }
    return this.x;
  }
  get settled() { return Math.abs(this.v) < this.eps * 4 && Math.abs(this.x - this.t) < this.eps; }
}

const Ticker = {
  fns: new Set(), last: 0, running: false,
  add(fn) {
    this.fns.add(fn);
    if (!this.running) { this.running = true; this.last = performance.now(); requestAnimationFrame(t => this.frame(t)); }
  },
  remove(fn) { this.fns.delete(fn); },
  frame(t) {
    const dt = Math.min(0.05, (t - this.last) / 1000); this.last = t;
    for (const fn of [...this.fns]) if (fn(dt) === false) this.fns.delete(fn);
    if (this.fns.size) requestAnimationFrame(t => this.frame(t)); else this.running = false;
  }
};

// Drive springs until they settle. Cancelling leaves each one holding its
// live value -- which is exactly where an interrupted motion resumes from.
function drive(springs, apply, done) {
  const list = Array.isArray(springs) ? springs : [springs];
  const fn = dt => {
    for (const s of list) s.step(dt);
    apply();
    if (list.every(s => s.settled)) { for (const s of list) { s.x = s.t; s.v = 0; } apply(); done && done(); return false; }
  };
  Ticker.add(fn);
  return () => Ticker.remove(fn);
}
// Where a flick would come to rest -- Apple's exponential form, not v²/2a.
function project(v, d = 0.998) { return (v / 1000) * d / (1 - d); }
// Progressive resistance past a boundary, rather than a hard stop.
function rubberband(over, dim, c = 0.55) { return (over * dim * c) / (dim + c * Math.abs(over)); }

class Tracker {
  constructor() { this.s = []; }
  reset() { this.s = []; }
  push(y, t) { this.s.push([y, t]); while (this.s.length > 1 && t - this.s[0][1] > 100) this.s.shift(); }
  velocity() {
    if (this.s.length < 2) return 0;
    const a = this.s[0], b = this.s[this.s.length - 1], dt = (b[1] - a[1]) / 1000;
    return dt > 0 ? (b[0] - a[0]) / dt : 0;
  }
}

const MONTHS = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June',
  Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };
const X_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function soonText(c) {
  if (c.pending || c.days === null) return '';
  return c.days < 0 ? `${-c.days}d ago` : c.days === 0 ? 'today' : c.days === 1 ? 'tomorrow'
    : c.days <= 30 ? `in ${c.days} days` : `in ${Math.round(c.days / 7)} wks`;
}

function renderAgenda() {
  const shown = CARDS.filter(c => course === 'all' || c.course === course);
  const list = document.getElementById('list');
  if (!shown.length) { list.innerHTML = `<div class="empty">Nothing waiting on you here.</div>`; return; }

  const byDay = new Map();
  shown.forEach(c => {
    const k = (!c.pending && c.date) ? c.date : 'none';
    (byDay.get(k) || byDay.set(k, []).get(k)).push(c);
  });
  const keys = [...byDay.keys()].sort((a, b) => a === 'none' ? 1 : b === 'none' ? -1 : a.localeCompare(b));

  let month = '';
  list.innerHTML = `<ul class="agenda">` + keys.map(k => {
    const items = byDay.get(k), first = items[0];
    let dow = '', num = '·', mon = '';
    if (k !== 'none') [dow, num, mon] = esc(first.when).replace(/\b0(\d)/, '$1').split(' ');
    let head = '';
    if (k === 'none') { head = `<li class="ag-month">No date yet</li>`; }
    else if (mon !== month) { month = mon; head = `<li class="ag-month">${MONTHS[mon] || mon}</li>`; }
    return head + `<li class="ag-day${first.days === 0 ? ' today' : ''}${k === 'none' ? ' none' : ''}">
      <div class="ag-date"><span class="dow">${dow.toUpperCase()}</span><span class="num">${num}</span></div>
      <div class="ag-items">${items.map(agRow).join('')}</div></li>`;
  }).join('') + `</ul>`;
}

function agRow(c) {
  const sub = [
    c.time ? `<b>${esc(c.time)}</b>` : '',
    c.linkedTo ? `<span class="linked">before ${esc(c.linkedTo)}</span>` : '',
    `<span>${esc(c.courseCode)}</span>`,
    c.kind === 'todo' && !c.date ? `<span>to do</span>` : '',
    c.confidence !== 'high' ? `<span class="unsure">${c.confidence === 'low' ? 'unsure' : 'check'}</span>` : '',
    c.onCalendar ? `<span class="oncal">in calendar</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="ag-row" data-id="${c.id}" data-urgency="${urgencyOf(c)}">
    <button class="ag-item" onclick="openSheet(${c.id})">
      <span class="ttl">${esc(c.title)}</span><span class="sub">${sub}</span></button>
    <div class="ag-acts">
      <button class="ax" aria-label="Dismiss" onclick="decide(${c.id}, 'dismissed')">${X_ICON}</button>
      <button class="ak" aria-label="Keep — add to calendar" onclick="decide(${c.id}, 'accepted')">${CHECK_ICON}</button>
    </div></div>`;
}

function collapseRow(el, done) {
  const h0 = el.offsetHeight, h = new Spring(h0, { response: 0.3, eps: 0.3 });
  el.style.height = h0 + 'px'; el.style.overflow = 'hidden';
  h.retarget(0);
  drive(h, () => { el.style.height = h.x + 'px'; el.style.opacity = Math.max(0, h.x / h0); }, done);
}

// ------------------------------------------------------------- the sheet
// One number describes it: how many px are visible. Three resting points,
// chosen by projecting the finger's velocity; Apple's own drawer values.
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
const vis = new Spring(0, { response: 0.3, damping: 0.8, eps: 0.3 });
let sheetCancel = null, SHEET_ID = null;
const SNAPS = () => ({ closed: 0, half: window.innerHeight * 0.5, full: window.innerHeight * 0.9 });

function applySheet() {
  const p = Math.min(1, vis.x / SNAPS().half);
  sheet.style.transform = `translateY(${sheet.offsetHeight - vis.x}px)`;
  sheet.style.visibility = vis.x > 1 ? 'visible' : 'hidden';
  sheet.setAttribute('aria-hidden', String(vis.x <= 1));
  scrim.style.opacity = p * 0.4;
  scrim.style.pointerEvents = vis.x > 4 ? 'auto' : 'none';
}
function goSheet(target, velocity) {
  sheetCancel && sheetCancel();
  vis.retarget(target, { velocity });
  sheetCancel = drive(vis, applySheet);
}
function openSheet(id) {
  const c = CARDS.find(x => x.id === id); if (!c) return;
  SHEET_ID = id;
  sheet.dataset.urgency = urgencyOf(c);
  document.getElementById('sheet-kind').textContent =
    c.kind + (c.confidence !== 'high' ? (c.confidence === 'low' ? ' · unsure' : ' · worth checking') : '');
  document.getElementById('sheet-title').textContent = c.title;
  document.getElementById('sheet-when').innerHTML = (!c.pending && c.date)
    ? `${esc(c.when)}${c.time ? ', ' + esc(c.time) : ''} <span>· ${soonText(c)}</span>`
    : `<span>${c.kind === 'todo' ? 'No deadline — a to-do' : 'Date not announced yet'}</span>`;
  document.getElementById('sheet-course').textContent = `${c.courseCode} · ${c.courseName || ''}`;
  document.getElementById('sheet-quote').textContent = c.evidence ? '“' + c.evidence + '”' : 'No excerpt was stored for this one.';
  // A linked date is inferred, not stated -- it says so, in the colour
  // the card uses for the same thing.
  document.getElementById('sheet-linked').textContent =
    c.linkedTo ? `Placed before ${c.linkedTo}${c.linkedWhy ? ' — ' + c.linkedWhy : ''}` : '';
  goSheet(SNAPS().half);
}
function closeSheet() { goSheet(0); }
function sheetDecide(newStatus) { const id = SHEET_ID; closeSheet(); if (id != null) decide(id, newStatus); }

(() => {
  const tracker = new Tracker();
  let active = false, startY = 0, grab = 0, pid = null;
  sheet.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    sheetCancel && sheetCancel();                  // catch it mid-flight
    active = true; startY = e.clientY; grab = vis.x; pid = e.pointerId;
    tracker.reset(); tracker.push(e.clientY, e.timeStamp);
    sheet.setPointerCapture(pid);
  });
  sheet.addEventListener('pointermove', e => {
    if (!active) return;
    tracker.push(e.clientY, e.timeStamp);
    const { full } = SNAPS();
    let v = grab - (e.clientY - startY);            // respects where it was grabbed
    if (v > full) v = full + rubberband(v - full, window.innerHeight, 0.55);
    if (v < 0) v = 0;
    vis.x = v; vis.v = 0; applySheet();
  });
  const release = () => {
    if (!active) return; active = false;
    try { sheet.releasePointerCapture(pid); } catch (_) {}
    const v = -tracker.velocity();                  // up is more visible
    const projected = vis.x + project(v);
    const s = SNAPS(), pts = [s.closed, s.half, s.full];
    goSheet(pts.reduce((a, b) => Math.abs(b - projected) < Math.abs(a - projected) ? b : a), v);
  };
  sheet.addEventListener('pointerup', release);
  sheet.addEventListener('pointercancel', release);
  addEventListener('resize', applySheet);
  applySheet();
})();

load();
loadHealth();
setInterval(loadHealth, 5 * 60 * 1000);
// Coming back to a home-screen app that has been in the background for
// hours should not show an hours-old "last checked" line.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadHealth();
});
</script>
</body>
</html>
