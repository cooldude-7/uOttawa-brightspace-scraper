<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Deadlines</title>

<!-- Home screen. On iOS these four are what turn "add to home screen" from a
     bookmark into something that opens full screen with its own icon; Safari
     reads them over plain http, so no tunnel is needed for this part.
     The status bar stays "default" rather than translucent on purpose: the
     header is sticky at top:0 and the page has no safe-area-inset-top, so a
     translucent bar would put the clock over the course filters. -->
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deadlines">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">

<!-- Maths in the prep notes. If this fails to load (no internet on the phone,
     say) the raw TeX shows instead, which is still readable -- so it is not
     worth blocking the page for. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16191f;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --yes: #12805c;
    --yes-bg: #e7f6f0;
    --no: #9aa1ab;
    --no-bg: #f0f2f4;
    --past: #b42318; --past-bg: #fde8e6;
    --now: #b4530a;  --now-bg: #fdeddd;
    --soon: #8a6100; --soon-bg: #fbf1d4;
    --mid: #1d4ed8;  --mid-bg: #e6edfd;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --ink: #e8eaed; --muted: #9aa1ab;
      --line: #262c36; --accent: #6ea8fe; --yes: #3ddc9a; --yes-bg: #12271f;
      --no: #7b828c; --no-bg: #1e232b;
      --past: #ff8b7d; --past-bg: #35211f;
      --now: #ffa964;  --now-bg: #33251a;
      --soon: #e8c25c; --soon-bg: #2f2a19;
      --mid: #8fb6ff;  --mid-bg: #1b2436;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 18px 16px 10px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: -0.02em; }
  .stats { color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); font-weight: 600; }

  /* A decision has to be reversible after the undo bar has gone, or a
     mis-tap is permanent. */
  .tabs { display: flex; gap: 4px; margin-top: 11px; }
  .tabs button {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 8px; font-size: 13px;
    border: 1px solid transparent; background: none; color: var(--muted);
    cursor: pointer; font-family: inherit;
  }
  .tabs button[aria-pressed="true"] {
    background: var(--card); border-color: var(--line); color: var(--ink);
    font-weight: 600;
  }
  .actions .back {
    width: auto; padding: 0 13px; font-size: 13px; font-weight: 600;
    color: var(--accent); background: var(--card);
  }
  .oncal { color: var(--yes); }

  .filters {
    display: flex; gap: 7px; overflow-x: auto; padding: 10px 16px 12px;
    scrollbar-width: none; background: var(--bg);
    position: sticky; top: 68px; z-index: 9; border-bottom: 1px solid var(--line);
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; }
  .group-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin: 22px 0 9px; font-weight: 600;
  }
  .group-label:first-child { margin-top: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 12px; margin-bottom: 9px;
    display: grid; grid-template-columns: auto 1fr minmax(150px, 300px) auto;
    gap: 13px; align-items: center;
    transition: opacity .18s, transform .18s;
  }

  /* Wide enough to spare the room: the quote sits in its own column
     instead of hiding behind a button, and the button is unnecessary. */
  .quote {
    font-size: 12.5px; line-height: 1.4; color: var(--muted); font-style: italic;
    border-left: 3px solid var(--chip-ink, var(--line)); padding-left: 10px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .note { display: none; }

  /* Below this the quote column will not fit, so it collapses behind the
     note button and opens across the foot of the card. */
  @media (max-width: 860px) {
    .card { grid-template-columns: auto 1fr auto; }
    .card .quote { display: none; }
    .card .note { display: grid; }
  }
  /* On a phone three buttons in one row squeeze the title into four
     lines, so they drop to their own row instead. */
  @media (max-width: 560px) {
    .card { grid-template-columns: auto 1fr; gap: 10px; }
    .card .actions { grid-column: 2; grid-row: 2; justify-self: end; }
  }
  .card.going { opacity: 0; transform: translateX(28px); }

  /* The date is the thing being scanned for, so it reads first: a block
     of its own, sized and coloured by how soon it is. */
  .date {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-width: 78px; padding: 8px 8px 7px;
    border-radius: 11px; background: var(--chip-bg); color: var(--chip-ink);
    line-height: 1.12;
  }
  .dow { font-size: 11px; font-weight: 700; letter-spacing: .09em; opacity: .8; }
  .dnum { font-size: 21px; font-weight: 750; letter-spacing: -0.02em; margin: 1px 0; }
  .dtime { font-size: 12.5px; font-weight: 650; opacity: .92; }
  .dsoon {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; margin-top: 3px; opacity: .82;
  }
  .date.none { min-width: 78px; background: transparent;
    border: 1px dashed var(--line); color: var(--muted); }
  .date.none .dnum { font-size: 13px; font-weight: 650; }

  /* Urgency palette -- red past due, orange now, amber this week. */
  .card[data-urgency="past"] { --chip-bg: var(--past-bg); --chip-ink: var(--past); }
  .card[data-urgency="now"]  { --chip-bg: var(--now-bg);  --chip-ink: var(--now); }
  .card[data-urgency="soon"] { --chip-bg: var(--soon-bg); --chip-ink: var(--soon); }
  .card[data-urgency="mid"]  { --chip-bg: var(--mid-bg);  --chip-ink: var(--mid); }
  .card[data-urgency="far"]  { --chip-bg: var(--no-bg);   --chip-ink: var(--muted); }
  .card[data-urgency="none"] { --chip-bg: transparent;    --chip-ink: var(--muted); }

  .title { font-size: 15px; font-weight: 600; margin: 0 0 4px; line-height: 1.3; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
    background: var(--no-bg); color: var(--muted);
  }
  .tag.unsure { color: var(--soon); }
  /* An inferred date -- tied to something dated, not stated by any
     document -- so it should not look like a published deadline. */
  .tag.linked { color: var(--accent); }

  .actions .note { margin-right: 6px; }
  .note {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .note svg { width: 16px; height: 16px; }
  .note[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note:active { transform: scale(.92); }

  .evidence {
    grid-column: 1 / -1; margin: 3px 2px 0; font-size: 12.5px; color: var(--muted);
    border-left: 3px solid var(--chip-ink, var(--line)); padding: 5px 0 5px 10px;
    font-style: italic;
  }

  .actions { display: flex; gap: 6px; align-items: center; }
  .actions button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    font-size: 17px; cursor: pointer; background: var(--no-bg); color: var(--no);
    font-family: inherit; display: grid; place-items: center;
  }
  .actions .yes { background: var(--yes-bg); color: var(--yes); border-color: transparent; }
  .actions button:active { transform: scale(.92); }

  /* The vault, read on a phone. Called .vnote, not .note: .note is
     already the little evidence button on a card, and the wide layout
     sets it to display:grid -- which turned a whole study document
     into a narrow grid column with a button's border round the title. Deliberately plain -- this is a study
     document, and anything decorative here is in the way. */
  .vnote { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px 15px; margin: 10px 12px; }
  .vnote h1 { font-size: 19px; margin: 0 0 10px; }
  .vnote h2 { font-size: 16px; margin: 20px 0 7px; }
  .vnote h3 { font-size: 14px; margin: 16px 0 5px; color: var(--muted); }
  .vnote p, .vnote li { font-size: 14px; line-height: 1.55; }
  /* A five-column cue sheet does not fit a phone. Let the table scroll
     inside the note rather than pushing the whole page sideways. */
  .vnote table { border-collapse: collapse; font-size: 13px; margin: 10px 0;
                 display: block; width: max-content; max-width: 100%;
                 overflow-x: auto; }
  .vnote th, .vnote td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; }
  .vnote th { background: var(--no-bg); }
  .vnote code { background: var(--no-bg); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .vnote pre { background: var(--no-bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .vnote blockquote { margin: 10px 0; padding: 2px 0 2px 12px;
                     border-left: 3px solid var(--line); color: var(--muted); }
  /* Wide tables scroll rather than squeezing the page sideways. */
  .vnote > * { max-width: 100%; }
  /* One conversation per course. Deliberately spare -- it is read on a
     phone, often standing up. */
  .msg { margin: 9px 12px; font-size: 14px; line-height: 1.55; }
  .msg.you { background: var(--accent); color: #fff; margin-left: 56px;
             padding: 9px 12px; border-radius: 13px 13px 3px 13px; }
  .msg.them { background: var(--card); border: 1px solid var(--line);
              margin-right: 24px; padding: 11px 13px;
              border-radius: 13px 13px 13px 3px; white-space: pre-wrap; }
  .msg.them table { border-collapse: collapse; font-size: 13px; display: block;
                    width: max-content; max-width: 100%; overflow-x: auto; }
  .msg.them th, .msg.them td { border: 1px solid var(--line); padding: 4px 6px; }
  .askbar { position: sticky; bottom: 0; background: var(--bg);
            padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .askbar textarea {
    flex: 1; font: inherit; font-size: 15px; padding: 9px 11px; resize: none;
    border: 1px solid var(--line); border-radius: 11px; background: var(--card);
    color: var(--ink); max-height: 120px;
  }
  .askbar button {
    background: var(--accent); color: #fff; border: none; border-radius: 11px;
    padding: 0 15px; font: inherit; font-weight: 650; cursor: pointer;
  }
  .askbar button:disabled { opacity: .45; }
  .asknote { text-align: center; color: var(--muted); font-size: 11.5px;
             padding: 4px 12px 0; }
  .noteitem { display: block; width: 100%; text-align: left; background: var(--card);
              border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
              margin: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .noteitem .where { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .noteitem .flag { color: var(--accent); font-size: 11.5px; }
  .backbar { margin: 10px 12px 0; }
  .backbar button { background: none; border: none; color: var(--accent);
                    font: inherit; font-size: 14px; cursor: pointer; padding: 4px 0; }
  .empty { text-align: center; color: var(--muted); padding: 56px 20px; font-size: 14px; }

  .undo {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 11px 16px;
    border-radius: 11px; font-size: 13.5px; display: none; gap: 14px;
    align-items: center; box-shadow: 0 5px 22px rgba(0,0,0,.22); z-index: 20;
  }
  .undo.show { display: flex; }
  .undo button {
    background: none; border: none; color: var(--bg); font-weight: 650;
    text-decoration: underline; cursor: pointer; font-size: 13.5px; font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1 id="heading">Deadlines</h1>
  <div class="stats" id="stats">loading…</div>
  <div class="tabs" id="modes">
    <button aria-pressed="true"  onclick="setMode('cards')">Deadlines</button>
    <button aria-pressed="false" onclick="setMode('notes')">Notes</button>
    <button aria-pressed="false" onclick="setMode('ask')">Ask</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="filters" id="filters"></div>

<main id="list"></main>

<div class="undo" id="undo">
  <span id="undo-text"></span>
  <button onclick="undoLast()">Undo</button>
</div>

<script>
let CARDS = [], COURSES = [], course = "all",
    status = "new", lastAction = null, undoTimer = null;

const api = (path, opts) => fetch(path, opts).then(r => r.json());

async function load() {
  // Labs and tutorials are always shown -- they are part of the week,
  // not a category to opt into.
  const data = await api(`/api/cards?status=${status}`);
  CARDS = data.cards;
  COURSES = data.courses;
  renderFilters();
  renderTabs();
  render();
  const s = await api('/api/summary');
  renderTabs(s);
  document.getElementById('stats').innerHTML =
    `<b>${s.new}</b> waiting · <b>${s.pending}</b> not scheduled yet · ${s.accepted} kept · ${s.dismissed} dismissed`;
}

function renderTabs(s) {
  const counts = s || {};
  const tabs = [['new', 'Waiting', counts.new], ['accepted', 'Kept', counts.accepted],
                ['dismissed', 'Dismissed', counts.dismissed]];
  document.getElementById('tabs').innerHTML = tabs.map(([v, label, n]) =>
    `<button aria-pressed="${status === v}" onclick="setStatus('${v}')">${label}${
      n === undefined ? '' : ` <span style="opacity:.6">${n}</span>`}</button>`).join('');
}

function setStatus(s) { status = s; course = 'all'; load(); }

function renderFilters() {
  // Chips carry the course's real name, not its code -- the code is on the
  // card itself, and a filter you cannot read is not a filter.
  const chips = (MODE === 'ask' ? [] : [['all', 'All courses']]).concat(
    COURSES.map(c => [c.value, c.name || c.code]));
  const el = document.getElementById('filters');
  el.innerHTML = chips.map(([v, label]) =>
    `<button class="chip" data-course="${esc(v)}" aria-pressed="${course === v}"
       onclick="setCourse('${esc(v).replace(/'/g, "\\'")}')">${esc(label)}</button>`
  ).join('');
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function setCourse(c) {
  course = c; renderFilters();
  if (MODE === 'notes') renderNotes();
  else if (MODE === 'ask') loadChat();
  else render();
}

// ------------------------------------------------------------------ notes

let MODE = 'cards', NOTES = [], OPEN = null;

const MODES = ['cards', 'notes', 'ask'];
const TITLES = { cards: 'Deadlines', notes: 'Notes', ask: 'Ask' };

function setMode(m) {
  MODE = m; OPEN = null;
  document.querySelectorAll('#modes button').forEach((b, i) =>
    b.setAttribute('aria-pressed', MODES[i] === m));
  document.getElementById('heading').textContent = TITLES[m];
  document.getElementById('tabs').style.display = m === 'cards' ? '' : 'none';
  if (m === 'notes') loadNotes();
  else if (m === 'ask') loadChat();
  else load();
}

async function loadNotes() {
  const data = await api('/api/vault');
  NOTES = data.notes || [];
  COURSES = [...new Set(NOTES.map(n => n.course).filter(Boolean))]
              .sort().map(c => ({ value: c, code: c, name: c }));
  document.getElementById('stats').textContent =
    data.built ? `${NOTES.length} notes in the vault`
               : 'No vault yet — run vault.py on the Pi';
  renderFilters();
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById('list');
  if (OPEN) {
    list.innerHTML =
      `<div class="backbar"><button onclick="closeNote()">&larr; All notes</button></div>
       <article class="vnote">${OPEN.html}</article>`;
    window.scrollTo(0, 0);
    if (window.renderMathInElement) {
      try {
        renderMathInElement(list, { delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false }], throwOnError: false });
      } catch (e) { /* raw TeX is still readable */ }
    }
    return;
  }

  const shown = NOTES.filter(n => course === 'all' || n.course === course);
  if (!shown.length) {
    list.innerHTML = `<div class="empty">No notes here yet.</div>`;
    return;
  }
  // Course note first, then prepared work, then everything else.
  shown.sort((a, b) => (a.order - b.order)
    || a.course.localeCompare(b.course) || a.title.localeCompare(b.title));

  list.innerHTML = shown.map(n => `
    <button class="noteitem" onclick="openNote('${esc(n.path).replace(/'/g, "\\'")}')">
      ${esc(n.title)}${n.prepared ? ' <span class="flag">· prepared</span>' : ''}
      <span class="where">${esc(n.course || 'Dashboard')}${
        n.folder ? ' · ' + esc(n.folder) : n.isCourseNote ? ' · course note' : ''}</span>
    </button>`).join('');
}

async function openNote(path) {
  OPEN = await api('/api/vault/note?path=' + encodeURIComponent(path));
  renderNotes();
}

function closeNote() { OPEN = null; renderNotes(); }

// -------------------------------------------------------------------- ask

let CHAT = [], CHAT_SPENT = 0, ASKING = false;

async function loadChat() {
  // Ask needs every course, not only the ones with a card waiting.
  if (!COURSES.length || MODE !== 'ask') {
    const c = await api('/api/courses');
    COURSES = c.courses;
  }
  if (course === 'all' && COURSES.length) course = COURSES[0].value;
  renderFilters();
  const data = await api('/api/chat?course=' + encodeURIComponent(course));
  CHAT = data.messages; CHAT_SPENT = data.spent;
  document.getElementById('stats').textContent =
    `Ask ${course} — $${CHAT_SPENT.toFixed(2)} spent on this course`;
  renderChat();
}

function renderChat() {
  const list = document.getElementById('list');
  const body = CHAT.length
    ? CHAT.map(m => `<div class="msg ${m.role === 'user' ? 'you' : 'them'}">${
        esc(m.text)}</div>`).join('')
    : `<div class="empty">Ask anything about ${esc(course)}.<br>
         Its lectures, syllabus and your deadlines are already loaded.</div>`;
  list.innerHTML = body + `
    <div class="asknote" id="asknote">${ASKING ? 'thinking…' : ''}</div>
    <div class="askbar">
      <textarea id="q" rows="1" placeholder="Ask about ${esc(course)}…"
        ${ASKING ? 'disabled' : ''}></textarea>
      <button id="send" onclick="send()" ${ASKING ? 'disabled' : ''}>Ask</button>
    </div>`;
  const q = document.getElementById('q');
  if (q) {
    q.addEventListener('input', () => {
      q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 120) + 'px';
    });
    // Enter sends, shift+enter makes a new line -- the phone keyboard's
    // return key is the obvious way to send.
    q.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  }
  window.scrollTo(0, document.body.scrollHeight);
}

async function send() {
  const q = document.getElementById('q');
  const text = (q && q.value || '').trim();
  if (!text || ASKING) return;
  CHAT.push({ role: 'user', text });
  ASKING = true; renderChat();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ course, message: text }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'failed');
    CHAT.push({ role: 'assistant', text: data.reply });
    CHAT_SPENT = data.spent;
    document.getElementById('stats').textContent =
      `Ask ${course} — $${CHAT_SPENT.toFixed(2)} spent on this course`;
  } catch (e) {
    CHAT.push({ role: 'assistant', text: 'Could not answer: ' + e.message });
  }
  ASKING = false; renderChat();
}

function bucket(card) {
  if (card.pending || card.days === null) return 'No date yet';
  if (card.days < 0) return 'Overdue';
  if (card.days === 0) return 'Today';
  if (card.days === 1) return 'Tomorrow';
  if (card.days <= 7) return 'This week';
  if (card.days <= 30) return 'This month';
  return 'Later';
}

const ORDER = ['Overdue', 'Today', 'Tomorrow', 'This week', 'This month', 'Later', 'No date yet'];

function render() {
  const shown = CARDS.filter(c => course === 'all' || c.course === course);
  const list = document.getElementById('list');

  if (!shown.length) {
    list.innerHTML = `<div class="empty">${
      status === 'new' ? 'Nothing waiting on you here.'
      : status === 'accepted' ? 'Nothing kept yet.' : 'Nothing dismissed yet.'}</div>`;
    return;
  }

  const groups = {};
  shown.forEach(c => (groups[bucket(c)] ||= []).push(c));

  list.innerHTML = ORDER.filter(g => groups[g]).map(g => `
    <div class="group-label">${g}</div>
    ${groups[g].map(cardHTML).join('')}
  `).join('');
}

const NOTE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

function urgencyOf(c) {
  if (c.pending || c.days === null) return 'none';
  if (c.days < 0) return 'past';
  if (c.days <= 1) return 'now';
  if (c.days <= 7) return 'soon';
  if (c.days <= 30) return 'mid';
  return 'far';
}

function dateBlock(c) {
  // A to-do has no date because none exists, which is different from a
  // deadline whose date has not been announced yet. Say which. A to-do that
  // has been linked to something dated falls through to the normal block.
  if (c.kind === 'todo' && !c.date) {
    return `<div class="date none"><span class="dnum">to do</span>
      <span class="dsoon">no deadline</span></div>`;
  }
  if (c.pending || !c.date) {
    return `<div class="date none"><span class="dnum">no date</span>
      <span class="dsoon">not set</span></div>`;
  }
  // "Tue 22 Sep" -> day name on top, number and month beneath.
  const [dow, ...rest] = esc(c.when).replace(/\b0(\d)/, '$1').split(' ');
  const soon = c.days < 0 ? `${-c.days}d ago`
    : c.days === 0 ? 'today' : c.days === 1 ? 'tomorrow'
    : c.days <= 30 ? `${c.days} days` : `${Math.round(c.days / 7)} wks`;
  return `<div class="date">
    <span class="dow">${dow}</span>
    <span class="dnum">${rest.join(' ')}</span>
    ${c.time ? `<span class="dtime">${esc(c.time)}</span>` : ''}
    <span class="dsoon">${soon}</span>
  </div>`;
}

function cardHTML(c) {
  const unsure = c.confidence !== 'high'
    ? `<span class="tag unsure">${c.confidence === 'low' ? 'unsure' : 'check'}</span>` : '';

  return `
  <article class="card" data-id="${c.id}" data-urgency="${urgencyOf(c)}">
    ${dateBlock(c)}
    <div class="body">
      <h2 class="title">${esc(c.title)}</h2>
      <div class="tags">
        <span class="tag">${esc(c.kind)}</span>
        <span class="tag">${esc(c.courseCode)}${c.courseName ? ' \u00b7 ' + esc(c.courseName) : ''}</span>
        ${c.linkedTo ? `<span class="tag linked">before ${esc(c.linkedTo)}</span>` : ''}
        ${c.onCalendar ? '<span class="tag oncal">in calendar</span>' : ''}
        ${unsure}
      </div>
    </div>
    <div class="quote">${c.evidence ? '\u201c' + esc(c.evidence.slice(0, 200)) + '\u201d' : ''}</div>
    <div class="actions">
      ${c.evidence
        ? `<button class="note" aria-expanded="false" aria-label="Where this came from"
             onclick="toggleNote(this, ${c.id})">${NOTE_ICON}</button>` : ''}
      ${status === 'new'
        ? `<button class="no" onclick="decide(${c.id}, 'dismissed')" aria-label="Dismiss">✕</button>
           <button class="yes" onclick="decide(${c.id}, 'accepted')" aria-label="Keep">✓</button>`
        : `<button class="back" onclick="decide(${c.id}, 'new')">put back</button>`}
    </div>
  </article>`;
}

function toggleNote(button, id) {
  const card = button.closest('.card');
  const open = button.getAttribute('aria-expanded') === 'true';
  const existing = card.querySelector('.evidence');
  if (existing) existing.remove();
  button.setAttribute('aria-expanded', String(!open));
  if (open) return;
  const c = CARDS.find(x => x.id === id);
  const p = document.createElement('div');
  p.className = 'evidence';
  p.textContent = '\u201c' + c.evidence.slice(0, 340) + '\u201d';
  card.appendChild(p);
}

async function decide(id, newStatus) {
  const card = CARDS.find(c => c.id === id);
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) el.classList.add('going');

  // Remove it locally straight away; a tap should never wait on the network.
  setTimeout(() => { CARDS = CARDS.filter(c => c.id !== id); render(); }, 180);
  const reply = await api('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, status: newStatus})
  });
  window.__lastCalendar = reply && reply.calendar;

  const result = await api('/api/summary').catch(() => null);
  lastAction = {id, card};
  showUndo(newStatus === 'accepted'
      ? (window.__lastCalendar === 'added' ? 'Added to calendar' : 'Kept')
    : newStatus === 'dismissed' ? 'Dismissed' : 'Put back', card);
  api('/api/summary').then(s => {
    renderTabs(s);
    document.getElementById('stats').innerHTML =
      `<b>${s.new}</b> waiting · <b>${s.pending}</b> not scheduled yet · ${s.accepted} kept · ${s.dismissed} dismissed`;
  });
}

function showUndo(what, card) {
  const bar = document.getElementById('undo');
  document.getElementById('undo-text').textContent = `${what}: ${card.title.slice(0, 34)}`;
  bar.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => bar.classList.remove('show'), 5000);
}

async function undoLast() {
  if (!lastAction) return;
  await api('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: lastAction.id, status: 'new'})
  });
  document.getElementById('undo').classList.remove('show');
  lastAction = null;
  load();
}

load();
</script>
</body>
</html>
