<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Deadlines</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16191f;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --yes: #12805c;
    --yes-bg: #e7f6f0;
    --no: #9aa1ab;
    --no-bg: #f0f2f4;
    --past: #b42318; --past-bg: #fde8e6;
    --now: #b4530a;  --now-bg: #fdeddd;
    --soon: #8a6100; --soon-bg: #fbf1d4;
    --mid: #1d4ed8;  --mid-bg: #e6edfd;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --ink: #e8eaed; --muted: #9aa1ab;
      --line: #262c36; --accent: #6ea8fe; --yes: #3ddc9a; --yes-bg: #12271f;
      --no: #7b828c; --no-bg: #1e232b;
      --past: #ff8b7d; --past-bg: #35211f;
      --now: #ffa964;  --now-bg: #33251a;
      --soon: #e8c25c; --soon-bg: #2f2a19;
      --mid: #8fb6ff;  --mid-bg: #1b2436;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 18px 16px 10px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: -0.02em; }
  .stats { color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); font-weight: 600; }

  .filters {
    display: flex; gap: 7px; overflow-x: auto; padding: 10px 16px 12px;
    scrollbar-width: none; background: var(--bg);
    position: sticky; top: 68px; z-index: 9; border-bottom: 1px solid var(--line);
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; }
  .group-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin: 22px 0 9px; font-weight: 600;
  }
  .group-label:first-child { margin-top: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 12px; margin-bottom: 9px;
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 11px; align-items: center;
    transition: opacity .18s, transform .18s;
  }
  /* On a phone three buttons in the same row squeeze the title into four
     lines, so below this width they drop to their own row instead. */
  @media (max-width: 560px) {
    .card { grid-template-columns: auto 1fr; gap: 10px; }
    .card .actions { grid-column: 2; grid-row: 2; justify-self: end; }
  }
  .card.going { opacity: 0; transform: translateX(28px); }

  /* The date is the thing being scanned for, so it reads first: a block
     of its own, sized and coloured by how soon it is. */
  .date {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-width: 78px; padding: 8px 8px 7px;
    border-radius: 11px; background: var(--chip-bg); color: var(--chip-ink);
    line-height: 1.12;
  }
  .dow { font-size: 11px; font-weight: 700; letter-spacing: .09em; opacity: .8; }
  .dnum { font-size: 21px; font-weight: 750; letter-spacing: -0.02em; margin: 1px 0; }
  .dtime { font-size: 12.5px; font-weight: 650; opacity: .92; }
  .dsoon {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; margin-top: 3px; opacity: .82;
  }
  .date.none { min-width: 78px; background: transparent;
    border: 1px dashed var(--line); color: var(--muted); }
  .date.none .dnum { font-size: 13px; font-weight: 650; }

  /* Urgency palette -- red past due, orange now, amber this week. */
  .card[data-urgency="past"] { --chip-bg: var(--past-bg); --chip-ink: var(--past); }
  .card[data-urgency="now"]  { --chip-bg: var(--now-bg);  --chip-ink: var(--now); }
  .card[data-urgency="soon"] { --chip-bg: var(--soon-bg); --chip-ink: var(--soon); }
  .card[data-urgency="mid"]  { --chip-bg: var(--mid-bg);  --chip-ink: var(--mid); }
  .card[data-urgency="far"]  { --chip-bg: var(--no-bg);   --chip-ink: var(--muted); }
  .card[data-urgency="none"] { --chip-bg: transparent;    --chip-ink: var(--muted); }

  .title { font-size: 15px; font-weight: 600; margin: 0 0 4px; line-height: 1.3; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
    background: var(--no-bg); color: var(--muted);
  }
  .tag.unsure { color: var(--soon); }

  .actions .note { margin-right: 6px; }
  .note {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .note svg { width: 16px; height: 16px; }
  .note[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note:active { transform: scale(.92); }

  .evidence {
    grid-column: 1 / -1; margin: 3px 2px 0; font-size: 12.5px; color: var(--muted);
    border-left: 3px solid var(--chip-ink, var(--line)); padding: 5px 0 5px 10px;
    font-style: italic;
  }

  .actions { display: flex; gap: 6px; align-items: center; }
  .actions button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    font-size: 17px; cursor: pointer; background: var(--no-bg); color: var(--no);
    font-family: inherit; display: grid; place-items: center;
  }
  .actions .yes { background: var(--yes-bg); color: var(--yes); border-color: transparent; }
  .actions button:active { transform: scale(.92); }

  .empty { text-align: center; color: var(--muted); padding: 56px 20px; font-size: 14px; }

  .undo {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 11px 16px;
    border-radius: 11px; font-size: 13.5px; display: none; gap: 14px;
    align-items: center; box-shadow: 0 5px 22px rgba(0,0,0,.22); z-index: 20;
  }
  .undo.show { display: flex; }
  .undo button {
    background: none; border: none; color: var(--bg); font-weight: 650;
    text-decoration: underline; cursor: pointer; font-size: 13.5px; font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>Deadlines</h1>
  <div class="stats" id="stats">loading…</div>
</header>

<div class="filters" id="filters"></div>

<main id="list"></main>

<div class="undo" id="undo">
  <span id="undo-text"></span>
  <button onclick="undoLast()">Undo</button>
</div>

<script>
let CARDS = [], COURSES = [], course = "all", sessions = "hide", lastAction = null, undoTimer = null;

const api = (path, opts) => fetch(path, opts).then(r => r.json());

async function load() {
  const data = await api(`/api/cards?sessions=${sessions}`);
  CARDS = data.cards;
  COURSES = data.courses;
  renderFilters();
  render();
  const s = await api('/api/summary');
  document.getElementById('stats').innerHTML =
    `<b>${s.new}</b> waiting · <b>${s.pending}</b> not scheduled yet · ${s.accepted} kept · ${s.dismissed} dismissed`;
}

function renderFilters() {
  const chips = [['all', 'All courses'], ...COURSES.map(c => [c, short(c)])];
  const el = document.getElementById('filters');
  el.innerHTML = chips.map(([v, label]) =>
    `<button class="chip" data-course="${esc(v)}" aria-pressed="${course === v}"
       onclick="setCourse('${esc(v).replace(/'/g, "\\'")}')">${esc(label)}</button>`
  ).join('') +
  `<button class="chip" aria-pressed="${sessions === 'all'}" onclick="toggleSessions()">
     ${sessions === 'hide' ? 'Show labs &amp; tutorials' : 'Hide labs &amp; tutorials'}</button>`;
}

const short = c => (c || '').split(/\s{2,}|\s-\s/)[0].trim().slice(0, 12) || c;
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function setCourse(c) { course = c; renderFilters(); render(); }
function toggleSessions() { sessions = sessions === 'hide' ? 'all' : 'hide'; load(); }

function bucket(card) {
  if (card.pending || card.days === null) return 'No date yet';
  if (card.days < 0) return 'Overdue';
  if (card.days === 0) return 'Today';
  if (card.days === 1) return 'Tomorrow';
  if (card.days <= 7) return 'This week';
  if (card.days <= 30) return 'This month';
  return 'Later';
}

const ORDER = ['Overdue', 'Today', 'Tomorrow', 'This week', 'This month', 'Later', 'No date yet'];

function render() {
  const shown = CARDS.filter(c => course === 'all' || c.course === course);
  const list = document.getElementById('list');

  if (!shown.length) {
    list.innerHTML = `<div class="empty">Nothing waiting on you here.</div>`;
    return;
  }

  const groups = {};
  shown.forEach(c => (groups[bucket(c)] ||= []).push(c));

  list.innerHTML = ORDER.filter(g => groups[g]).map(g => `
    <div class="group-label">${g}</div>
    ${groups[g].map(cardHTML).join('')}
  `).join('');
}

const NOTE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

function urgencyOf(c) {
  if (c.pending || c.days === null) return 'none';
  if (c.days < 0) return 'past';
  if (c.days <= 1) return 'now';
  if (c.days <= 7) return 'soon';
  if (c.days <= 30) return 'mid';
  return 'far';
}

function dateBlock(c) {
  if (c.pending || !c.date) {
    return `<div class="date none"><span class="dnum">no date</span>
      <span class="dsoon">not set</span></div>`;
  }
  // "Tue 22 Sep" -> day name on top, number and month beneath.
  const [dow, ...rest] = esc(c.when).replace(/\b0(\d)/, '$1').split(' ');
  const soon = c.days < 0 ? `${-c.days}d ago`
    : c.days === 0 ? 'today' : c.days === 1 ? 'tomorrow'
    : c.days <= 30 ? `${c.days} days` : `${Math.round(c.days / 7)} wks`;
  return `<div class="date">
    <span class="dow">${dow}</span>
    <span class="dnum">${rest.join(' ')}</span>
    ${c.time ? `<span class="dtime">${esc(c.time)}</span>` : ''}
    <span class="dsoon">${soon}</span>
  </div>`;
}

function cardHTML(c) {
  const unsure = c.confidence !== 'high'
    ? `<span class="tag unsure">${c.confidence === 'low' ? 'unsure' : 'check'}</span>` : '';

  return `
  <article class="card" data-id="${c.id}" data-urgency="${urgencyOf(c)}">
    ${dateBlock(c)}
    <div class="body">
      <h2 class="title">${esc(c.title)}</h2>
      <div class="tags">
        <span class="tag">${esc(c.kind)}</span>
        <span class="tag">${esc(short(c.course))}</span>
        ${unsure}
      </div>
    </div>
    <div class="actions">
      ${c.evidence
        ? `<button class="note" aria-expanded="false" aria-label="Where this came from"
             onclick="toggleNote(this, ${c.id})">${NOTE_ICON}</button>` : ''}
      <button class="no" onclick="decide(${c.id}, 'dismissed')" aria-label="Dismiss">✕</button>
      <button class="yes" onclick="decide(${c.id}, 'accepted')" aria-label="Keep">✓</button>
    </div>
  </article>`;
}

function toggleNote(button, id) {
  const card = button.closest('.card');
  const open = button.getAttribute('aria-expanded') === 'true';
  const existing = card.querySelector('.evidence');
  if (existing) existing.remove();
  button.setAttribute('aria-expanded', String(!open));
  if (open) return;
  const c = CARDS.find(x => x.id === id);
  const p = document.createElement('div');
  p.className = 'evidence';
  p.textContent = '\u201c' + c.evidence.slice(0, 340) + '\u201d';
  card.appendChild(p);
}

async function decide(id, status) {
  const card = CARDS.find(c => c.id === id);
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) el.classList.add('going');

  // Remove it locally straight away; a tap should never wait on the network.
  setTimeout(() => { CARDS = CARDS.filter(c => c.id !== id); render(); }, 180);
  await api('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, status})
  });

  lastAction = {id, card};
  showUndo(status === 'accepted' ? 'Kept' : 'Dismissed', card);
  api('/api/summary').then(s => {
    document.getElementById('stats').innerHTML =
      `<b>${s.new}</b> waiting · <b>${s.pending}</b> not scheduled yet · ${s.accepted} kept · ${s.dismissed} dismissed`;
  });
}

function showUndo(what, card) {
  const bar = document.getElementById('undo');
  document.getElementById('undo-text').textContent = `${what}: ${card.title.slice(0, 34)}`;
  bar.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => bar.classList.remove('show'), 5000);
}

async function undoLast() {
  if (!lastAction) return;
  await api('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: lastAction.id, status: 'new'})
  });
  document.getElementById('undo').classList.remove('show');
  lastAction = null;
  load();
}

load();
</script>
</body>
</html>
